[package]
name = "cirnet-cli"
version = "0.3.0-dev.1"
edition = "2024"
rust-version = "1.99"
description = "CIRNETLAB native development CLI"
license-file = "LICENSE"
repository = "https://github.com/cirnetlab/cirnet-cli"
publish = false

[[bin]]
name = "cnl"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.5.51", default-features = false, features = ["std", "help", "usage", "error-context"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["bracketed-paste", "events", "windows"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }
